name: Pubblica Borgo Antico su GitHub Pages

on:
  push:
    branches: [claude/medieval-city-builder-iphone-8bjk2c]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura GitHub Pages (attiva il sito se non esiste)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il gioco come artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: borgo-antico

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
